name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript syntax
        run: |
          status=0
          for f in $(find . -name "*.js" -not -path "./.git/*"); do
            node --check "$f" || status=1
          done
          exit $status
      - name: plugin manifests
        run: node tools/validate.js
